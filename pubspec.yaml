name: expensecast
description: ExpenseCast - Predictive Expense Management App (Milestone 1 UI + receipt capture)
publish_to: "none"
version: 0.1.0+1

environment:
  # Dart 3.6 ships with Flutter 3.27 - the minimum version that has Color.withValues()
  # and CardThemeData, used in lib/core/theme.dart.
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (MVVM - ViewModel layer)
  provider: ^6.1.2

  # Receipt capture: scan + perspective correction, then on-device OCR
  cunning_document_scanner: ^3.0.3
  google_mlkit_text_recognition: ^0.16.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
